androidxAnnotation = "1.10.0"
androidxAppCompat = "1.8.0"
androidxBiometric = "1.4.0-alpha07"
androidxCamera = "1.6.1"
androidxComposeBom = "2026.08.00"
androidxCore = "1.19.0"
androidxCoreSplashscreen = "1.2.0"
androidxDataStore = "1.2.1"
androidxLifecycle = "2.11.0"
androidxNavigation3 = "1.1.5"
androidxRoom = "3.0.1"
encoding = "2.6.0"
googleZxing = "3.5.4"
koin = "4.2.2"
kotlin = "2.4.10"
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxSerialization = "1.11.0"
ksp = "2.3.11"

[libraries]
android-gradle = { module = "com.android.tools.build:gradle-api", version.ref = "androidGradlePlugin" }
compose-gradle = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppCompat" }
